services:
  ingest-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ingest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_DB_USER: ingest_app
      APP_DB_PASSWORD: ${INGEST_DB_PASSWORD:-ingest-local-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ingest"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: [ingest-data:/var/lib/postgresql/data]
    configs:
      - source: postgres_app_role
        target: /docker-entrypoint-initdb.d/010-app-role.sql

  billing-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_DB_USER: billing_app
      APP_DB_PASSWORD: ${BILLING_DB_PASSWORD:-billing-local-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billing"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: [billing-data:/var/lib/postgresql/data]
    configs:
      - source: postgres_app_role
        target: /docker-entrypoint-initdb.d/010-app-role.sql

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
    ports:
      - "15672:15672"
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 180s

  ingest:
    build: ./services/ingest
    environment:
      DATABASE_URL: postgresql+asyncpg://ingest_app:${INGEST_DB_PASSWORD:-ingest-local-password}@ingest-db:5432/ingest
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672/
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-in-production}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
      WEB_CONCURRENCY: ${INGEST_WORKERS:-1}
    depends_on:
      ingest-db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    ports: ["8000:8000"]

  billing:
    build: ./services/billing
    environment:
      DATABASE_URL: postgresql+asyncpg://billing_app:${BILLING_DB_PASSWORD:-billing-local-password}@billing-db:5432/billing
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672/
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-in-production}
      INGEST_MANAGEMENT_URL: http://ingest:8002
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-demo-dashboard-token}
      ACCOUNT_DASHBOARD_TOKENS: ${ACCOUNT_DASHBOARD_TOKENS:-}
    depends_on:
      billing-db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    ports: ["8001:8001"]

  # One-shot: loads ~500k realistic events into both databases after migrations ran (idempotent; skip
  # with SEED_EVENTS=0). It finishes in a minute or two; the ready-banner below waits for it.
  seed:
    build:
      context: .
      dockerfile: scripts/Dockerfile
    command: ["seed.py"]
    restart: "no"
    environment:
      INGEST_DATABASE_URL: postgresql://ingest_app:${INGEST_DB_PASSWORD:-ingest-local-password}@ingest-db:5432/ingest
      BILLING_DATABASE_URL: postgresql://billing_app:${BILLING_DB_PASSWORD:-billing-local-password}@billing-db:5432/billing
      SEED_EVENTS: ${SEED_EVENTS:-500000}
    depends_on:
      ingest: {condition: service_healthy}
      billing: {condition: service_healthy}

  generator:
    build: ./generator
    environment:
      INGEST_URL: http://ingest:8000
      INGEST_MANAGEMENT_URL: http://ingest:8002
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-4}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-in-production}
    depends_on:
      ingest: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
    depends_on:
      billing: {condition: service_healthy}
    ports: ["5173:8080"]

  # One-shot: waits until every service answers and the seed has finished, then prints clickable links.
  # Missed it? Run:  docker compose logs ready-banner
  ready-banner:
    image: alpine:3.20
    restart: "no"
    depends_on:
      ingest: {condition: service_healthy}
      billing: {condition: service_healthy}
      frontend: {condition: service_started}
      seed: {condition: service_completed_successfully}
    command:
      - sh
      - -c
      - |
        for url in http://ingest:8000/docs http://billing:8001/docs http://frontend:8080; do
          until wget -q -O /dev/null "$$url"; do sleep 2; done
        done
        echo ""
        echo "========================================================"
        echo "  ALL SERVICES ARE READY. Click a link to open it:"
        echo ""
        echo "  App (frontend):      http://localhost:5173"
        echo "  Ingest API docs:     http://localhost:8000/docs"
        echo "  Billing API docs:    http://localhost:8001/docs"
        echo "  RabbitMQ dashboard:  http://localhost:15672  (user: app / password: app)"
        echo ""
        echo "  Missed this box? Run: docker compose logs ready-banner"
        echo "========================================================"

  ops-tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: scripts/Dockerfile
    environment:
      INGEST_DATABASE_URL: postgresql://ingest_app:${INGEST_DB_PASSWORD:-ingest-local-password}@ingest-db:5432/ingest
      BILLING_DATABASE_URL: postgresql://billing_app:${BILLING_DB_PASSWORD:-billing-local-password}@billing-db:5432/billing
      INGEST_URL: http://ingest:8000
      INGEST_MANAGEMENT_URL: http://ingest:8002
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-in-production}
    depends_on:
      ingest: {condition: service_healthy}
      billing: {condition: service_healthy}

  ingest-tests:
    profiles: ["tests"]
    build:
      context: .
      dockerfile: scripts/test.Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://ingest_app:${INGEST_DB_PASSWORD:-ingest-local-password}@ingest-db:5432/ingest
      RABBITMQ_URL: amqp://unused
      INTERNAL_TOKEN: test-only-token
    depends_on:
      ingest-db: {condition: service_healthy}
    command: ["sh", "-c", "cd services/ingest && alembic upgrade head && pytest -q tests"]

  billing-tests:
    profiles: ["tests"]
    build:
      context: .
      dockerfile: scripts/test.Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://billing_app:${BILLING_DB_PASSWORD:-billing-local-password}@billing-db:5432/billing
      RABBITMQ_URL: amqp://unused
      INTERNAL_TOKEN: test-only-token
      DASHBOARD_TOKEN: test-finance-token
    depends_on:
      billing-db: {condition: service_healthy}
    command: ["sh", "-c", "cd services/billing && alembic upgrade head && pytest -q tests"]

volumes:
  ingest-data:
  billing-data:

configs:
  postgres_app_role:
    file: ./database/init/010-app-role.sql